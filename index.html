<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Herald Archives | Transcription Search</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Daily Herald Archives</h1>
        <p>Search and verify Daily Herald press photograph transcriptions.</p>

        <nav class="site-nav">
            <a href="schema.html">Schema &rarr;</a>
        </nav>

        <div class="search-panel">
            <div class="search-container">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search transcription, title, dates, photographers, places, people, rights..."
                    autocomplete="off"
                >

                <button
                    id="wholeWordToggle"
                    title="Partial match — click for whole word"
                    aria-label="Toggle whole-word search"
                >
                    W
                </button>
            </div>

            <div class="search-options">
                <label>
                    <input type="checkbox" id="includeRationalesToggle">
                    Include rationales in search
                </label>

                <label>
                    <input type="checkbox" id="showStructuredToggle" checked>
                    Show structured metadata
                </label>
            </div>
        </div>
    </header>

    <main id="gallery-container"></main>

    <div class="pagination">
        <button id="prevBtn">&larr; Previous</button>
        <div id="pageIndicator">Page 1</div>
        <button id="nextBtn">Next &rarr;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
